<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f6">
  <title>PM Dashboard Prototype · Flow map</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="prototype-stage">
    <div class="prototype-frame">
      <!-- Layer A: prototype-only controls. Product UI is a separate sibling. -->
      <aside class="flow-controller" aria-label="Prototype controller" data-layer="prototype-controller">
        <div class="controller-heading">
          <div class="controller-head-row">
            <p class="eyebrow">PROTOTYPE</p>
            <button
              class="flow-area-toggle"
              id="flow-area-toggle"
              type="button"
              aria-controls="prototype-controls"
              aria-expanded="true"
              aria-label="Collapse prototype controls"
              title="Collapse prototype controls"
            >
              <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <path d="m10 3.5-4.5 4.5 4.5 4.5" />
              </svg>
            </button>
          </div>
          <h1>Flow map</h1>
          <p class="controller-description">Choose a role, then a flow, to preview its experience.</p>
        </div>

        <div class="controller-options" id="prototype-controls">
          <section class="flow-role-section" aria-label="Choose a prototype role">
            <div class="section-heading">
              <span>Preview role</span>
              <span class="flow-role-pill" id="proto-active-role">PM Admin</span>
            </div>
            <div class="flow-role-switch" role="group" aria-label="Choose PM Admin or PM flow">
              <button
                class="flow-role-option is-active"
                id="proto-role-admin"
                type="button"
                data-proto-role="pm-admin"
                aria-label="Preview as PM Admin"
                aria-pressed="true"
              >
                PM Admin
              </button>
              <button
                class="flow-role-option"
                id="proto-role-pm"
                type="button"
                data-proto-role="pm"
                aria-label="Preview as PM"
                aria-pressed="false"
              >
                PM
              </button>
            </div>
            <p class="flow-role-hint">Updates the product preview with that role’s actions and permissions.</p>
          </section>

          <nav class="flow-navigation" id="flow-navigation" aria-label="Prototype flows">
            <div class="section-heading">
              <span>Flows</span>
              <span class="flow-count" id="flow-count" aria-label="Number of flows">01</span>
            </div>
            <ol class="flow-list" id="flow-list"></ol>
          </nav>
        </div>

        <div class="controller-footer">
          <span class="footer-indicator" aria-hidden="true"></span>
          <span>Prototype controller</span>
        </div>
      </aside>

      <!-- Layer B: the product screen sits inside its own screen frame. -->
      <main class="product-workspace" aria-label="Product preview workspace" data-layer="product-ui">
        <header class="workspace-header">
          <div class="workspace-context">
            <span class="eyebrow">PRODUCT VIEWPORT</span>
            <span class="context-divider" aria-hidden="true"></span>
            <span class="active-flow-label" id="active-flow-label" aria-live="polite">Flow 01</span>
          </div>
          <span class="workspace-note">Embedded application</span>
        </header>

        <div class="product-screen-frame" role="group" aria-label="Product screen preview">
          <section class="product-viewport" id="product-viewport" aria-label="PM Dashboard product UI">
            <div class="product-app-root" id="product-app-root"></div>
          </section>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
